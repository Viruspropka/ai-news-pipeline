[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-news-pipeline"
version = "0.1.0"
description = "LLM-scored AI news pipeline: ingest feeds, dedupe, score, verify against hype, compose a brief, deliver to pluggable sinks."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alexey Berezka" }]
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=2,<3"]
dev = ["pytest>=8"]

[project.scripts]
ai-news-pipeline = "ai_news_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_news_pipeline = ["data/*.yaml", "data/demo_feeds/*.xml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
